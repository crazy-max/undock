name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

on:
  push:
    branches:
      - 'main'
    tags:
      - 'v*'
  pull_request:

env:
  DOCKERHUB_SLUG: crazymax/undock
  GHCR_SLUG: ghcr.io/${{ github.repository }}
  DESTDIR: ./bin
  DOCKER_BUILD_SUMMARY: false
  GO_VERSION: "1.27"

jobs:
  prepare:
    runs-on: ubuntu-26.04
    outputs:
      validate-includes: ${{ steps.validate.outputs.matrix }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Validate matrix
        id: validate
        uses: docker/bake-action/subaction/matrix@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          target: validate
          fields: platforms
        env:
          GOLANGCI_LINT_MULTIPLATFORM: 1

  validate:
    runs-on: ubuntu-26.04
    needs:
      - prepare
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.prepare.outputs.validate-includes) }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Validate
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: ${{ matrix.target }}
          set: |
            *.platform=${{ matrix.platforms }}

  artifacts:
    uses: docker/github-builder/.github/workflows/bake.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read # same as global permissions
      id-token: write # for signing attestations with GitHub OIDC Token
    with:
      runner: ubuntu-26.04
      target: artifact-all
      output: local
      artifact-name: undock
      artifact-upload: true
      sbom: true
      sign: ${{ github.event_name != 'pull_request' }}
      set: |
        *.args.GIT_FETCH_HISTORY=1

  artifacts-finalize:
    runs-on: ubuntu-26.04
    needs:
      - artifacts
    steps:
      -
        name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.artifacts.outputs.artifact-name }}
          path: /tmp/buildx-output
      -
        name: Rename provenance and sbom
        run: |
          for pdir in /tmp/buildx-output/*/; do
            (
              cd "$pdir"
              binname=$(find . -name 'undock_*')
              filename=$(basename "$binname" | sed -E 's/\.(tar\.gz|zip)$//')
              mv "provenance.json" "${filename}.provenance.json"
              mv "sbom-binary.spdx.json" "${filename}.sbom.json"
              find . -name 'sbom*.json' -exec rm {} \;
              if [ -f "provenance.sigstore.json" ]; then
                mv "provenance.sigstore.json" "${filename}.sigstore.json"
              fi
            )
          done
          mkdir -p "${{ env.DESTDIR }}"
          mv /tmp/buildx-output/**/* "${{ env.DESTDIR }}/"
      -
        name: List artifacts
        working-directory: ${{ env.DESTDIR }}
        run: |
          tree -nh .
      -
        name: Check artifacts
        working-directory: ${{ env.DESTDIR }}
        run: |
          find . -type f -exec file -e ascii -- {} +
      -
        name: Upload release binaries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release
          path: ${{ env.DESTDIR }}/*
          if-no-files-found: error

  test-unit:
    runs-on: ubuntu-26.04
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Test
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: test
          pull: true
      -
        name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          directory: ${{ env.DESTDIR }}/coverage
          token: ${{ secrets.CODECOV_TOKEN }}

  test-integration:
    runs-on: ubuntu-26.04
    env:
      TEST_PUBLIC_REGISTRY: "1"
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Integration tests
        run: docker compose -f test/compose.yaml run --build --rm tests
      -
        name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: bin/coverage/integration/coverage.txt
          flags: integration
          token: ${{ secrets.CODECOV_TOKEN }}
      -
        name: Logs
        if: always()
        run: docker compose -f test/compose.yaml logs
      -
        name: Cleanup
        if: always()
        run: docker compose -f test/compose.yaml down --volumes --remove-orphans

  test-native:
    runs-on: ${{ matrix.runner }}
    name: test-native (${{ matrix.platform }})
    needs:
      - artifacts-finalize
    strategy:
      fail-fast: false
      matrix:
        include:
          -
            platform: darwin-amd64
            runner: macos-26-intel
          -
            platform: darwin-arm64
            runner: macos-26
          -
            platform: linux-amd64
            runner: ubuntu-26.04
          -
            platform: linux-arm64
            runner: ubuntu-24.04-arm
          -
            platform: windows-amd64
            runner: windows-2025
    env:
      CGO_ENABLED: "0"
      TEST_PUBLIC_REGISTRY: "1"
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Set up Go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: "${{ env.GO_VERSION }}"
          check-latest: true
      -
        name: Download binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ env.DESTDIR }}/artifact
          name: release
      -
        name: Extract binary
        shell: bash
        env:
          PLATFORM_PAIR: ${{ matrix.platform }}
        run: |
          mkdir -p ./bin/build
          platform=${PLATFORM_PAIR//-/_}
          if [ "$RUNNER_OS" = "Windows" ]; then
            unzip -q ./bin/artifact/undock_*_${platform}.zip -d ./bin/build
            binary="$(cygpath -w "$PWD/bin/build/undock.exe")"
          else
            tar -xzf ./bin/artifact/undock_*_${platform}.tar.gz -C ./bin/build
            chmod +x ./bin/build/undock
            binary="$PWD/bin/build/undock"
          fi
          echo "UNDOCK_BIN=$binary" >> "$GITHUB_ENV"
      -
        name: Integration tests
        run: go test -mod=vendor -tags "integration containers_image_openpgp exclude_graphdriver_btrfs exclude_graphdriver_devicemapper" -count=1 -v -timeout=10m "-coverpkg=./internal/...,./pkg/..." -covermode=atomic "-coverprofile=bin/coverage-native.txt" ./test/integration
      -
        name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: bin/coverage-native.txt
          flags: native
          name: native-${{ matrix.platform }}
          token: ${{ secrets.CODECOV_TOKEN }}

  release:
    runs-on: ubuntu-26.04
    permissions:
      contents: write # required to create GitHub release
    needs:
      - artifacts-finalize
      - test-unit
      - test-integration
      - test-native
    steps:
      -
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      -
        name: Download release binaries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ env.DESTDIR }}/artifact
          name: release
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      -
        name: Build
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          source: .
          targets: release
          provenance: false
      -
        name: List artifacts
        working-directory: ${{ env.DESTDIR }}/release
        run: |
          tree -nh .
      -
        name: GitHub Release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        if: startsWith(github.ref, 'refs/tags/')
        with:
          draft: true
          files: |
            ${{ env.DESTDIR }}/release/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image-prepare:
    runs-on: ubuntu-26.04
    outputs:
      repo-slugs: |
        ${{ env.DOCKERHUB_SLUG }}
        ${{ env.GHCR_SLUG }}
    steps:
      # FIXME: can't use env object in reusable workflow inputs: https://github.com/orgs/community/discussions/26671
      - run: echo "Exposing env vars for reusable workflow"

  image:
    uses: docker/github-builder/.github/workflows/bake.yml@a31d2311da4d55e21b978c1c52bab82ba97d51ee # v1.19.0
    permissions:
      contents: read # same as global permissions
      packages: write # required to push to GHCR
      id-token: write # for signing attestations with GitHub OIDC Token
    needs:
      - image-prepare
      - artifacts-finalize
      - test-unit
      - test-integration
      - test-native
    with:
      runner: ubuntu-26.04
      target: image-all
      output: image
      push: ${{ github.event_name != 'pull_request' }}
      sbom: true
      set-meta-labels: true
      meta-images: |
        ${{ needs.image-prepare.outputs.repo-slugs }}
      meta-tags: |
        type=semver,pattern={{version}}
        type=semver,pattern={{major}}.{{minor}}
        type=ref,event=pr
        type=edge
      meta-labels: |
        org.opencontainers.image.title=Undock
        org.opencontainers.image.description=Extract contents of a container image in a local folder
        org.opencontainers.image.vendor=CrazyMax
      set: |
        *.args.GIT_FETCH_HISTORY=1
    secrets:
      registry-auths: |
        - registry: docker.io
          username: ${{ vars.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
        - registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
